name: Build FrienOS 0.6.0-beta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-from-scratch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc binutils grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Compile FrienOS 64-bit kernel
        run: |
          mkdir -p build iso/boot/grub
          nasm -f elf64 src/boot.asm -o build/boot.o
          gcc -m64 -ffreestanding -fno-stack-protector -fno-pic -mno-red-zone -mcmodel=kernel -O2 -Wall -Wextra -c src/kernel.c -o build/kernel.o
          ld -n -T src/linker.ld -o iso/boot/frenos.bin build/boot.o build/kernel.o
          grub-file --is-x86-multiboot2 iso/boot/frenos.bin

      - name: Build FrienOS-0.6.0-beta.iso
        run: |
          cat << 'EOF' > iso/boot/grub/grub.cfg
          set default=0
          set timeout=3
          set gfxmode=1024x768x32
          insmod all_video
          insmod gfxterm
          terminal_output gfxterm

          menuentry "FrienOS 0.6.0-beta" {
              set gfxpayload=1024x768x32
              multiboot2 /boot/frenos.bin
              boot
          }
          EOF
          grub-mkrescue -o FrienOS-0.6.0-beta.iso iso

      - name: Publish FrienOS-0.6.0-beta.iso
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.6.0-beta
          name: FrienOS 0.6.0 Beta
          files: FrienOS-0.6.0-beta.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
